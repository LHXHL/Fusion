[package]
name = "fusion-logic"
version = "0.1.0"
edition = "2021"
description = "Fusion pure logic API (URL/config/status) for native FFI and WASM W1"

[lib]
crate-type = ["rlib", "cdylib"]

[features]
default = []
wasm = ["dep:wasm-bindgen"]

[dependencies]
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
toml = "0.8.19"
url = "2.5.0"
wasm-bindgen = { version = "0.2.100", optional = true }
