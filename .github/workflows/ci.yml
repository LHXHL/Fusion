name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Run library tests
        run: cargo test --lib

  fusion-logic:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Test fusion-logic
        run: cargo test -p fusion-logic
      - name: Build fusion-logic for wasm32
        run: cargo build -p fusion-logic --release --target wasm32-unknown-unknown --features wasm

  build-release:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Build release library and binary
        run: |
          cargo build --release --lib
          cargo build --release --bin fusion
