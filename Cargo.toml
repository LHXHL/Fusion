[workspace]
members = [".", "crates/fusion-logic"]
resolver = "2"

[package]
name = "fusion"
version = "0.1.0"
edition = "2021"

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[dependencies]
fusion-logic = { path = "crates/fusion-logic" }
h2 = "0.4.12"
bytes = "1.10.1"
http = "1.3.1"
aes-gcm-siv = "0.11.1"
chrono = "0.4.39"
clap = { version = "4.4.8", features = ["derive"] }
crossterm = "0.28.1"
data-encoding = "2.5.0"
env_logger = "0.10.1"
flate2 = "1.0.35"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
log = "0.4.20"
mac_address = "*"
native-tls = "0.2.12"
openssl = "0.10.68"
portable-pty = "0.8.1"
rand = "0.8.5"
rustls = "0.23.10"
rustls-pemfile = "2.2.0"
screenshots = "0.8.6"
serde = { version = "1.0.193", features = ["derive"] }
serde_json = "1.0.108"
sha2 = "0.10.8"
tokio = { version = "1.41.1", features = ["full"] }
tokio-rustls = "0.26.2"
tokio-tungstenite = { version = "0.20", features = ["native-tls"] }
toml = "0.8.19"
url = "2.5.0"
uuid = { version = "1.7.0", features = ["v5"] }
x25519-dalek = { version = "2.0.0", features = ["static_secrets"] }

[dev-dependencies]
rcgen = "0.12.0"
